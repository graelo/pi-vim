# See the lints at https://github.com/rvben/rumdl/tree/main/docs
[global]
flavor = "mkdocs"
disable = [
  "MD007",  # prefer the flavor over MD007
  "MD046",  # allow code blocks to be indented and fenced
]
# openspec/changes/archive is historical; .pi/ is generated by `openspec update`.
exclude = ["node_modules", "openspec/changes/archive", ".pi"]

[MD013]
line-length = 80
code-blocks = false
tables = false
headings = false
reflow = true

[MD033]
allowed-elements = ["kbd", "a"]


[MD025]
front-matter-title = ""

# GitHub issue and PR templates start with front matter or a section, not a title.
[per-file-ignores]
".github/**/*.md" = ["MD041"]
